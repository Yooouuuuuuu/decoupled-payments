# slf4j-simple. Our own log level and the Kafka library's are set from the logLevel setting at startup
# (see cli.Logging); the Kafka level here applies until then, e.g. in the unit tests.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.log.org.apache.kafka=warn
